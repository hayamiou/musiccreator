<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicaLau - POC</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="piano.css">
    <link rel="stylesheet" href="game.css">
  </head>

<body>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">MusicaLau</div>
      <nav class="top-actions">
        <div class="import-menu">
          <button id="importToggle" class="import-btn" aria-expanded="false"
            aria-controls="importDropdown">Importer</button>
          <div id="importDropdown" class="import-dropdown" role="menu" aria-hidden="true">
            <div class="import-panel" aria-label="Zone d'import de fichier">
              <p class="import-hint">Glissez-déposez vos fichiers ou cliquez pour sélectionner</p>
              <div class="dropzone" id="dropzone" role="button" tabindex="0" aria-label="Déposez vos fichiers ici">
                <input type="file" id="fileInput" class="sr-only" multiple aria-hidden="true" />
                <span class="drop-icon" aria-hidden="true">⬆</span>
                <span class="drop-text">Déposez les fichiers ici</span>
              </div>
              <button id="chooseFileBtn" class="choose-btn" aria-label="Choisir un fichier">Choisir un fichier</button>
              <div id="importFeedback" class="import-feedback" aria-live="polite"></div>
              <!-- Bouton Play/Stop -->
              <button id="playToggle" class="play-toggle">
                <span class="icon play-icon">▶</span>
                <span class="icon stop-icon">■</span>
              </button>
            </div>

            <!-- Diviseur de durée -->
            <div class="duration-divider" style="display:flex; align-items:center; gap:10px; margin-top:16px;">
              <label for="durationDivider" style="font-weight:500;">Vitesse (diviseur):</label>
              <input type="range" id="durationDivider" min="0.1" max="4" step="0.1" value="1"
                aria-label="Diviseur de durée" style="width:180px;">
              <span id="durationDividerValue" style="color:#6e6e73;">1.0×</span>
        </div>
    </div>
    </nav>
    </div>
  </header>

  <div class="container">
    <div class="instrument-selector" aria-label="Sélection d'instrument">
      <button id="pianoBtn" class="instrument-btn" data-instrument="piano" aria-label="Choisir Piano">Piano</button>
      <button id="violinBtn" class="instrument-btn" data-instrument="violin" aria-label="Choisir Violon">Violon</button>
      <button id="guitarBtn" class="instrument-btn" data-instrument="guitar"
        aria-label="Choisir Guitare">Guitare</button>
    </div>
  </div>

  <div id="piano">
    <div class="keys black">
      <div class="touche_noire key-button" id="C#6" data-key="a">A <br />C#6</div>
      <div class="touche_noire key-button" id="D#6" data-key="z">Z <br />D#6</div>
      <div class="touche_noire key-button" id="F#6" data-key="e">E <br />F#6</div>
      <div class="touche_noire key-button" id="G#6" data-key="r">R <br />G#6</div>
      <div class="touche_noire key-button" id="A#6" data-key="t">T <br />A#6</div>
      <div class="touche_noire key-button" id="C#7" data-key="y">Y <br />C#7</div>
      <div class="touche_noire key-button" id="D#7" data-key="u">U <br />D#7</div>
      <div class="touche_noire key-button" id="F#7" data-key="i">I <br />F#7</div>
      <div class="touche_noire key-button" id="G#7" data-key="o">O <br />G#7</div>
      <div class="touche_noire key-button" id="A#7" data-key="p">P <br />A#7</div>
    </div>

    <div class="keys white">
      <div class="touche_blanche key-button" id="C6" data-key="q">Q <br />C6</div>
      <div class="touche_blanche key-button" id="D6" data-key="s">S <br />D6</div>
      <div class="touche_blanche key-button" id="E6" data-key="d">D <br />E6</div>
      <div class="touche_blanche key-button" id="F6" data-key="f">F <br />F6</div>
      <div class="touche_blanche key-button" id="G6" data-key="g">G <br />G6</div>
      <div class="touche_blanche key-button" id="A6" data-key="h">H <br />A6</div>
      <div class="touche_blanche key-button" id="B6" data-key="j">J <br />B6</div>
      <div class="touche_blanche key-button" id="C7" data-key="k">K <br />C7</div>
      <div class="touche_blanche key-button" id="D7" data-key="l">L <br />D7</div>
      <div class="touche_blanche key-button" id="E7" data-key="m">M <br />E7</div>
      <div class="touche_blanche key-button" id="F7" data-key="n">N <br />F7</div>
      <div class="touche_blanche key-button" id="G7" data-key=",">, <br />G7</div>
      <div class="touche_blanche key-button" id="A7" data-key=";">; <br />A7</div>
      <div class="touche_blanche key-button" id="B7" data-key=":">: <br />B7</div>
      <div class="touche_blanche key-button" id="C8" data-key="!">! <br />C8</div>
    </div>
  </div>

  <div class="recordingBtn">
      <button onclick="start_enregistrement()" id="startRecBtn"><div class="circle" id="circle"></div></button>
      <button onclick="stop_enregistrement()">Arrêter d'enregistrer</button>
      <button onclick="telechargement_enregistrement()">Télécharger l'enregistrement</button>
    </div>

  <!-- CDN Tone.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>


  <!-- Parser -->
  <script src="parsing.js"></script>
  <!-- Script principal -->
  <script src="script.js"> </script>
  <script src="piano.js"></script>
  <script src="game.js"></script>

</body>

</html>
