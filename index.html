<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthé Tone.js</title>
    <script src="https://cdn.jsdelivr.net/npm/tone@14.7.77/build/Tone.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }
        .instructions {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>Synthé Tone.js</h1>
    <div class="instructions">
        <p>Maintiens la touche <strong>A</strong> pour jouer une note.</p>
        <p>Appuie sur la touche <strong>S</strong> pour moduler la note (changer sa fréquence).</p>
    </div>

    <script>
        const synth = new Tone.Synth().toDestination();

        let isKeyAPressed = false;
        let isKeySPressed = false;
        let currentFrequency = 440;

document.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'a' && !isKeyAPressed) {
        isKeyAPressed = true;
        synth.triggerAttack(currentFrequency);
    }
    if (e.key.toLowerCase() === 's' && !isKeySPressed) {
        isKeySPressed = true;
        currentFrequency = 550; 
        if (isKeyAPressed) {
            synth.setNote(currentFrequency);
        }
    }
});

document.addEventListener('keyup', (e) => {
    if (e.key.toLowerCase() === 'a') {
        isKeyAPressed = false;
        synth.triggerRelease();
    }
    if (e.key.toLowerCase() === 's') {
        isKeySPressed = false;
        currentFrequency = 440;
        if (isKeyAPressed) {
            synth.setNote(currentFrequency);
        }
    }
});


        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'a' && isKeyAPressed) {
                isKeyAPressed = false;
                synth.triggerRelease();
            }
            if (e.key.toLowerCase() === 's') {
                isKeySPressed = false;
            }
        });
    </script>
</body>
</html>
