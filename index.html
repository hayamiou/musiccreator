<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MusicaLau - POC</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }

      .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        text-align: center;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
      }

      button {
        background: #667eea;
        color: white;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.3s;
        margin: 10px;
      }

      button:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎵 MusicaLau - POC</h1>
      <p>Cliquez sur le bouton pour jouer une note G4 pendant 1 seconde</p>
      <button id="playBtn">🎹 Jouer Note G4</button>
      <div class="instrument-selector" aria-label="Sélection d'instrument">
        <button id="pianoBtn" class="instrument-btn" data-instrument="piano" aria-label="Choisir Piano">Piano</button>
        <button id="violinBtn" class="instrument-btn" data-instrument="violin" aria-label="Choisir Violon">Violon</button>
        <button id="guitarBtn" class="instrument-btn" data-instrument="guitar" aria-label="Choisir Guitare">Guitare</button>
      </div>
    </div>



    <input type="file" name="" id="musicFile" />
    <button id="importFile" onclick="importFile()">Import</button>

    <!-- CDN Tone.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <!-- Script principal -->
    <script src="script.js"></script>
  </body>
</html>
